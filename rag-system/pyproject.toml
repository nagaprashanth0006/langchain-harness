[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-system"
version = "1.0.0"
description = "Pluggable RAG pipeline"
requires-python = ">=3.11"


[tool.setuptools]
py-modules = ["config", "models", "main"]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", ".data*", ".cache*", "*.egg-info"]


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
